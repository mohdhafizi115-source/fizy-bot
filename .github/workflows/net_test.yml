name: net test
on: workflow_dispatch
jobs:
  t:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: bash
        run: |
          for u in https://download.mql5.com/cdn/web/just.global.markets/mt5/justmarkets5setup.exe https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe https://www.mql5.com; do
            curl -sS -o /dev/null -m 40 -w "$u %{http_code} %{size_download}\n" "$u" || echo "$u FAILED"
          done
