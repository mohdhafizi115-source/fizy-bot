name: MT5 auto trader

# One trading shift (about 5h40m) of the FizyLB EA (London breakout on gold + RSI2 H1 on gold, 28 forex
# pairs and BTCUSD) on a GitHub Windows runner. Shifts chain 24/7: each one dispatches the next; the scanner
# loop restarts the chain when no shift is queued or running.
# Switch: mt5_trade.txt line 1 "on" / "off", line 2 the lot size. Demo accounts only (the EA refuses others).
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "shift length in minutes (test: 5)"
        required: false
        default: "335"

permissions:
  contents: write
  actions: write

concurrency:
  group: mt5-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Switch
        id: sw
        shell: bash
        run: |
          # a queued shift checks out the commit of its dispatch time: take the newest switch and status files
          git fetch -q origin main && git checkout -q origin/main -- mt5_trade.txt status/ 2>/dev/null || true
          mode=$(head -1 mt5_trade.txt 2>/dev/null | tr -dc a-z)
          lot=$(sed -n 2p mt5_trade.txt 2>/dev/null | tr -dc 0-9.)
          rlot=$(sed -n 3p mt5_trade.txt 2>/dev/null | tr -dc 0-9.)
          echo "mode=${mode:-off}" >> "$GITHUB_OUTPUT"
          echo "lot=${lot:-0.01}" >> "$GITHUB_OUTPUT"
          echo "rlot=${rlot:-${lot:-0.01}}" >> "$GITHUB_OUTPUT"
          echo "auto trade: ${mode:-off}, London lot ${lot:-0.01}, RSI2 lot ${rlot:-${lot:-0.01}}"

      - name: Install packages
        if: steps.sw.outputs.mode == 'on'
        run: pip install -r requirements.txt tzdata

      - name: Install the JustMarkets MT5 terminal and compile the EA
        id: inst
        if: steps.sw.outputs.mode == 'on'
        shell: pwsh
        env:
          LOT: ${{ steps.sw.outputs.lot }}
          RLOT: ${{ steps.sw.outputs.rlot }}
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/just.global.markets/mt5/justmarkets5setup.exe" -OutFile jm.exe
          $p = Start-Process -FilePath .\jm.exe -ArgumentList "/auto" -PassThru
          for ($i = 0; $i -lt 120 -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 20
          Get-Process terminal64, metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
          # first start fills the MQL5 folder (Include\Trade\Trade.mqh etc.) needed to compile the EA
          $dir = "C:\Program Files\JustMarkets MetaTrader 5"
          $f = Start-Process -FilePath "$dir\terminal64.exe" -ArgumentList "/portable" -PassThru
          for ($i = 0; $i -lt 24 -and -not (Test-Path "$dir\MQL5\Include\Trade\Trade.mqh"); $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "MQL5 include folder ready: $(Test-Path "$dir\MQL5\Include\Trade\Trade.mqh")"
          New-Item -ItemType Directory -Force -Path "$dir\Config", "$dir\MQL5\Experts" | Out-Null
          Copy-Item mt5\servers.dat "$dir\Config\servers.dat" -Force
          (Get-Content mt5\FizyLB.mq5) -replace '^input double InpLot\s*=.*;', "input double InpLot        = $env:LOT;" | Set-Content "$dir\MQL5\Experts\FizyLB.mq5" -Encoding utf8
          (Get-Content mt5\FizyRSI2.mqh) -replace '^input double InpRsiLot\s*=.*;', "input double InpRsiLot     = $env:RLOT;" | Set-Content "$dir\MQL5\Experts\FizyRSI2.mqh" -Encoding utf8
          Copy-Item mt5\FizySnap.mqh "$dir\MQL5\Experts\FizySnap.mqh" -Force
          $m = "${{ github.event.inputs.minutes }}"
          if ($m -and [int]$m -lt 30) {           # short test shift: screenshot with the start message
            (Get-Content "$dir\MQL5\Experts\FizyLB.mq5") -replace '^input bool   InpSnapTest\s*=.*;', 'input bool   InpSnapTest   = true;' | Set-Content "$dir\MQL5\Experts\FizyLB.mq5" -Encoding utf8
          }
          $c = Start-Process -FilePath "$dir\metaeditor64.exe" -ArgumentList "/portable /compile:`"$dir\MQL5\Experts\FizyLB.mq5`" /log:`"$dir\compile.log`"" -PassThru
          for ($i = 0; $i -lt 40 -and -not $c.HasExited; $i++) { Start-Sleep -Seconds 3 }
          Get-Process metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
          "EA compile: ex5 exists $(Test-Path "$dir\MQL5\Experts\FizyLB.ex5")" | Out-File shift_diag.txt -Encoding utf8
          Get-Content "$dir\compile.log" | Where-Object { $_ -match "error|warning|Result" } | Select-Object -First 15 | ForEach-Object { "  " + $_ } | Out-File shift_diag.txt -Append -Encoding utf8
          if (-not (Test-Path "$dir\MQL5\Experts\FizyLB.ex5")) { Write-Host "EA compile failed"; exit 1 }

      - name: Trade (EA in the terminal, events to Telegram)
        if: steps.sw.outputs.mode == 'on'
        shell: pwsh
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Continue"
          $dir = "C:\Program Files\JustMarkets MetaTrader 5"
          $ini = "[Common]`r`nLogin=$env:MT5_LOGIN`r`nPassword=$env:MT5_PASSWORD`r`nServer=$env:MT5_SERVER`r`nKeepPrivate=1`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=1`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nExpert=FizyLB`r`nSymbol=XAUUSD.m`r`nPeriod=M15`r`n"
          [IO.File]::WriteAllText("$dir\start.ini", $ini, [Text.Encoding]::Unicode)
          Start-Process -FilePath "$dir\terminal64.exe" -ArgumentList "/portable /config:`"$dir\start.ini`""
          Start-Sleep -Seconds 30
          Remove-Item "$dir\start.ini" -ErrorAction SilentlyContinue
          $m = if ("${{ github.event.inputs.minutes }}") { "${{ github.event.inputs.minutes }}" } else { "335" }
          python mt5/watch.py --dir "$dir" --minutes $m 2>&1 | Tee-Object -FilePath watch.log
          $ev = "$dir\MQL5\Files\flb_events.txt"
          $rv = "$dir\MQL5\Files\rsi2_events.txt"
          "events: London $((Get-Content $ev -ErrorAction SilentlyContinue | Measure-Object).Count) lines, RSI2 $((Get-Content $rv -ErrorAction SilentlyContinue | Measure-Object).Count) lines" | Out-File shift_diag.txt -Append -Encoding utf8
          $el = Get-ChildItem "$dir\MQL5\Logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($el) { Get-Content $el.FullName -Tail 12 | ForEach-Object { "  " + ($_ -replace '\d{5,}', '<num>' -replace '\b\d{1,3}(\.\d{1,3}){3}\b', '<ip>' -replace '\$-?[\d.,]+', '$x') } | Out-File shift_diag.txt -Append -Encoding utf8 }
          Get-Content watch.log -Tail 15 | ForEach-Object { "  w: " + $_ } | Out-File shift_diag.txt -Append -Encoding utf8
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Next shift
        if: always() && steps.sw.outputs.mode == 'on' && steps.inst.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python mt5/next_shift.py

      - name: Shift summary (no account details)
        if: always() && steps.sw.outputs.mode == 'on'
        shell: bash
        run: |
          mkdir -p status
          { echo "shift ended (UTC): $(date -u '+%Y-%m-%d %H:%M')"; cat mt5_shift.txt 2>/dev/null; cat shift_diag.txt 2>/dev/null; } > status/mt5_trade.txt
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add status/mt5_trade.txt status/mt5_online.txt 2>/dev/null || git add status/mt5_trade.txt
          git commit -q -m "MT5 shift summary" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 5; done || true
