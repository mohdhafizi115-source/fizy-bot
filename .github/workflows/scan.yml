name: BBMA scanner

on:
  schedule:
    - cron: "1,31 * * * 0-5"   # backup starter (UTC, Sunday to Friday); the scan itself loops, see below
  workflow_dispatch:                  # "Run workflow" button for a manual run
  push:                               # first run right after the files are uploaded
    branches: [main]
    paths: ["bbma_scanner.py", ".github/workflows/scan.yml", "send_example.txt", "run_research.txt", "run_audit.txt"]

permissions:
  contents: write                     # only for the keep-alive commit below

# Scheduled / manual runs stay alive ~5.5 h and scan 1 s after every M15 candle close (scan_delay.txt)
# (GitHub's own 15-minute schedule is often 30-60 minutes late). While one loop runs, the next
# scheduled run waits in the queue and takes over when it ends. Push runs only do the example /
# research jobs, in their own group, so they never wait behind the loop.
concurrency:
  group: bbma-${{ github.event_name == 'push' && 'push' || 'scanner' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore state (last candle checked, last alert)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Scan
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          PROVIDER: ${{ vars.PROVIDER }}
          SYMBOLS: ${{ vars.SYMBOLS }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then exit 0; fi
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          n=0
          while :; do
            python bbma_scanner.py || echo "scan failed, retry next candle"
            git fetch -q origin main && git reset -q --hard origin/main || true   # newest code / settings for the next candle
            n=$((n + 1))
            if [ $n -le 3 ] || [ "$(date -u +%M)" -lt 5 ]; then   # run summary in status/ (first 3 scans, then hourly)
              mkdir -p status && cp state/last_run.txt status/last_run.txt 2>/dev/null || true
              git add status/last_run.txt 2>/dev/null && git commit -q -m "run summary" && git push -q origin HEAD:main || true
            fi
            now=$(date +%s)
            delay=$(cat scan_delay.txt 2>/dev/null | tr -dc 0-9); delay=${delay:-1}
            iv=$(cat scan_interval.txt 2>/dev/null | tr -dc 0-9); iv=${iv:-900}     # 300 = every M5 close, 900 = M15
            next=$(( (now / iv + 1) * iv + delay ))             # right after the next candle close
            [ $next -ge $end ] && break
            sleep $(( next - now ))
          done

      - name: Example chart (when send_example.txt exists)
        if: github.event_name != 'schedule' && hashFiles('send_example.txt') != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROVIDER: ${{ vars.PROVIDER }}
          SYMBOLS: ${{ vars.SYMBOLS }}
        run: |
          python bbma_scanner.py --example
          mkdir -p status && cp state/example.txt status/example.txt || true
          git rm -q send_example.txt
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add status/example.txt || true
          git commit -m "example sent" || true
          git push || true

      - name: Research backtest (when run_research.txt exists)
        if: github.event_name != 'schedule' && hashFiles('run_research.txt') != ''
        run: |
          python research/$(head -1 run_research.txt | tr -dc "A-Za-z0-9_." || echo ms_forex.py)
          git rm -q run_research.txt
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add status/research.txt || true
          git commit -m "research results" || true
          git push || true

      - name: Audit all pairs (when run_audit.txt exists)
        if: github.event_name == 'push' && hashFiles('run_audit.txt') != ''
        env:
          PROVIDER: ${{ vars.PROVIDER }}
          SYMBOLS: ${{ vars.SYMBOLS }}
        run: |
          python bbma_scanner.py --audit "$(head -1 run_audit.txt)"
          mkdir -p status && cp state/audit.txt status/audit.txt || true
          git rm -q run_audit.txt
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add status/audit.txt || true
          git commit -m "audit results" || true
          git pull -q --rebase origin main || true
          git push || true

      - name: Save state
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}

      - name: Publish the run summary (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p status
          cp state/last_run.txt status/last_run.txt 2>/dev/null || echo "no summary" > status/last_run.txt
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add status/last_run.txt
          git commit -m "run summary" || true
          git push || true

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows after 60 days without a commit: push an empty one every 45 days
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "fizy-bot"
            git config user.email "fizy-bot@users.noreply.github.com"
            git commit --allow-empty -m "keep the scanner schedule alive"
            git push
          fi
