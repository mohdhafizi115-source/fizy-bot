name: MT5 economic calendar export

# Exports the MQL5 economic calendar history (read-only, no trading) through the JustMarkets terminal and commits
# it as data/calendar.csv for the news research (research/news.py).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt5-cal
  cancel-in-progress: false

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the terminal and compile the export EA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/just.global.markets/mt5/justmarkets5setup.exe" -OutFile jm.exe
          $p = Start-Process -FilePath .\jm.exe -ArgumentList "/auto" -PassThru
          for ($i = 0; $i -lt 120 -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 20
          Get-Process terminal64, metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $dir = "C:\Program Files\JustMarkets MetaTrader 5"
          $f = Start-Process -FilePath "$dir\terminal64.exe" -ArgumentList "/portable" -PassThru
          for ($i = 0; $i -lt 24 -and -not (Test-Path "$dir\MQL5\Include\Trade\Trade.mqh"); $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path "$dir\Config", "$dir\MQL5\Experts" | Out-Null
          Copy-Item mt5\servers.dat "$dir\Config\servers.dat" -Force
          Copy-Item mt5\ExportCal.mq5 "$dir\MQL5\Experts\ExportCal.mq5" -Force
          $c = Start-Process -FilePath "$dir\metaeditor64.exe" -ArgumentList "/portable /compile:`"$dir\MQL5\Experts\ExportCal.mq5`" /log:`"$dir\compile.log`"" -PassThru
          for ($i = 0; $i -lt 40 -and -not $c.HasExited; $i++) { Start-Sleep -Seconds 3 }
          Get-Process metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$dir\compile.log" | Where-Object { $_ -match "error|warning|Result" } | Select-Object -First 15
          if (-not (Test-Path "$dir\MQL5\Experts\ExportCal.ex5")) { Write-Host "compile failed"; exit 1 }

      - name: Export the calendar (no trading)
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Continue"
          $dir = "C:\Program Files\JustMarkets MetaTrader 5"
          $ini = "[Common]`r`nLogin=$env:MT5_LOGIN`r`nPassword=$env:MT5_PASSWORD`r`nServer=$env:MT5_SERVER`r`nKeepPrivate=1`r`nNewsEnable=1`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nExpert=ExportCal`r`nSymbol=XAUUSD.m`r`nPeriod=M5`r`n"
          [IO.File]::WriteAllText("$dir\start.ini", $ini, [Text.Encoding]::Unicode)
          $t = Start-Process -FilePath "$dir\terminal64.exe" -ArgumentList "/portable /config:`"$dir\start.ini`"" -PassThru
          Start-Sleep -Seconds 30
          Remove-Item "$dir\start.ini" -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 150 -and -not $t.HasExited; $i++) { Start-Sleep -Seconds 5 }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path data, status | Out-Null
          Copy-Item "$dir\MQL5\Files\cal\calendar.csv" data\calendar.csv -Force -ErrorAction SilentlyContinue
          $m = Get-Content "$dir\MQL5\Files\cal\meta.txt" -ErrorAction SilentlyContinue
          "calendar export $(Get-Date -Format u): $m; rows $((Get-Content data\calendar.csv -ErrorAction SilentlyContinue | Measure-Object).Count)" | Out-File status\cal_export.txt -Encoding utf8
          $el = Get-ChildItem "$dir\MQL5\Logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($el) { Get-Content $el.FullName -Tail 8 | ForEach-Object { "  " + ($_ -replace '\d{5,}', '<num>' -replace '\b\d{1,3}(\.\d{1,3}){3}\b', '<ip>') } | Out-File status\cal_export.txt -Append -Encoding utf8 }
          Get-Content status\cal_export.txt

      - name: Commit the calendar
        if: always()
        shell: bash
        run: |
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add data/calendar.csv status/cal_export.txt 2>/dev/null || git add status/cal_export.txt
          git commit -q -m "Economic calendar export" || true
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q && break; sleep 7; done || true
