name: MT5 history export and research

# Exports the broker's M5 history (JustMarkets demo, read-only, no trading) for gold, BTC and 28 forex pairs on a
# Windows runner, keeps it as a workflow artifact (m5data), then runs a research script on it on Linux and commits
# the text results. To re-run only the research on an earlier export, pass that run's id as data_run.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "research script to run on the data"
        required: false
        default: "research/scalp_all.py"
      data_run:
        description: "reuse the m5data artifact of this earlier run id (skip the export)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: mt5-data-${{ github.event.inputs.script || 'default' }}
  cancel-in-progress: false

jobs:
  export:
    if: github.event.inputs.data_run == ''
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install the JustMarkets MT5 terminal and compile the export EA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/just.global.markets/mt5/justmarkets5setup.exe" -OutFile jm.exe
          $p = Start-Process -FilePath .\jm.exe -ArgumentList "/auto" -PassThru
          for ($i = 0; $i -lt 120 -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 20
          Get-Process terminal64, metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $dir = "C:\Program Files\JustMarkets MetaTrader 5"
          $f = Start-Process -FilePath "$dir\terminal64.exe" -ArgumentList "/portable" -PassThru
          for ($i = 0; $i -lt 24 -and -not (Test-Path "$dir\MQL5\Include\Trade\Trade.mqh"); $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 10
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path "$dir\Config", "$dir\MQL5\Experts" | Out-Null
          Copy-Item mt5\servers.dat "$dir\Config\servers.dat" -Force
          Copy-Item mt5\ExportM5.mq5 "$dir\MQL5\Experts\ExportM5.mq5" -Force
          $c = Start-Process -FilePath "$dir\metaeditor64.exe" -ArgumentList "/portable /compile:`"$dir\MQL5\Experts\ExportM5.mq5`" /log:`"$dir\compile.log`"" -PassThru
          for ($i = 0; $i -lt 40 -and -not $c.HasExited; $i++) { Start-Sleep -Seconds 3 }
          Get-Process metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$dir\compile.log" | Where-Object { $_ -match "error|warning|Result" } | Select-Object -First 15
          if (-not (Test-Path "$dir\MQL5\Experts\ExportM5.ex5")) { Write-Host "compile failed"; exit 1 }

      - name: Export the M5 history (no trading)
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Continue"
          $dir = "C:\Program Files\JustMarkets MetaTrader 5"
          $ini = "[Common]`r`nLogin=$env:MT5_LOGIN`r`nPassword=$env:MT5_PASSWORD`r`nServer=$env:MT5_SERVER`r`nKeepPrivate=1`r`nNewsEnable=0`r`n[Charts]`r`nMaxBars=10000000`r`n[Experts]`r`nAllowLiveTrading=0`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nExpert=ExportM5`r`nSymbol=XAUUSD.m`r`nPeriod=M5`r`n"
          [IO.File]::WriteAllText("$dir\start.ini", $ini, [Text.Encoding]::Unicode)
          $t = Start-Process -FilePath "$dir\terminal64.exe" -ArgumentList "/portable /config:`"$dir\start.ini`"" -PassThru
          Start-Sleep -Seconds 30
          Remove-Item "$dir\start.ini" -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 780 -and -not $t.HasExited; $i++) {
            Start-Sleep -Seconds 10
            if ($i % 30 -eq 0) { Write-Host "$($i * 10) s: $((Get-ChildItem "$dir\MQL5\Files\m5data\*.csv" -ErrorAction SilentlyContinue | Measure-Object).Count) symbol files" }
          }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path m5data | Out-Null
          Copy-Item "$dir\MQL5\Files\m5data\*" m5data\ -Force -ErrorAction SilentlyContinue
          Get-Content m5data\meta.txt -ErrorAction SilentlyContinue
          if (-not (Test-Path m5data\done.txt)) { Write-Host "export did not finish" }

      - uses: actions/upload-artifact@v4
        with:
          name: m5data
          path: m5data
          retention-days: 60
          compression-level: 9

  research:
    needs: export
    if: always() && (needs.export.result == 'success' || github.event.inputs.data_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: m5data
          path: m5data
          run-id: ${{ github.event.inputs.data_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the research script
        run: |
          git pull -q origin main || true          # use the newest research script
          pip install -q pandas numpy scikit-learn
          mkdir -p research/status status
          { echo "export run: ${{ github.event.inputs.data_run || github.run_id }}"; cat m5data/meta.txt; } > status/m5_export.txt
          S="${{ github.event.inputs.script }}"; S="${S:-research/scalp_all.py}"
          python "$S" m5data > "research/status/$(basename "$S" .py).txt" 2>&1 || true

      - name: Commit the results
        run: |
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add research/status/ status/m5_export.txt
          git commit -q -m "MT5 data research results" || true
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q && break; sleep 7; done || true
