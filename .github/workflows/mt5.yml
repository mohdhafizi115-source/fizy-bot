name: MT5 trader

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["run_mt5.txt"]

permissions:
  contents: write

concurrency:
  group: mt5
  cancel-in-progress: false

jobs:
  mt5:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MetaTrader 5 (silent) and start it once
        shell: pwsh
        env:
          HAS_LOGIN: ${{ secrets.MT5_LOGIN != '' }}
          HAS_PASSWORD: ${{ secrets.MT5_PASSWORD != '' }}
          HAS_SERVER: ${{ secrets.MT5_SERVER != '' }}
          VAR_LOGIN: ${{ vars.MT5_LOGIN != '' }}
        run: |
          New-Item -ItemType Directory -Force -Path status | Out-Null
          $d = "status\mt5_diag.txt"
          "secret MT5_LOGIN set: $env:HAS_LOGIN, MT5_PASSWORD: $env:HAS_PASSWORD, MT5_SERVER: $env:HAS_SERVER, variable MT5_LOGIN: $env:VAR_LOGIN" | Out-File $d -Encoding utf8
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          "installer size: $((Get-Item mt5setup.exe).Length)" | Out-File $d -Append -Encoding utf8
          $p = Start-Process -FilePath .\mt5setup.exe -ArgumentList "/auto" -PassThru
          for ($i = 0; $i -lt 120 -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 5 }
          "installer exited: $($p.HasExited) after about $($i * 5) s, exit code $($p.ExitCode)" | Out-File $d -Append -Encoding utf8
          Start-Sleep -Seconds 20
          "processes after install: $((Get-Process terminal64, mt5setup, metaeditor64 -ErrorAction SilentlyContinue | ForEach-Object { $_.Name + ' (window: ' + $_.MainWindowTitle + ')' }) -join ', ')" | Out-File $d -Append -Encoding utf8
          Get-Process terminal64, mt5setup -ErrorAction SilentlyContinue | Stop-Process -Force
          $dir = "C:\Program Files\MetaTrader 5"
          "install dir files: $((Get-ChildItem $dir -ErrorAction SilentlyContinue | ForEach-Object { $_.Name + ':' + $_.Length }) -join ', ')" | Out-File $d -Append -Encoding utf8
          $t = Start-Process -FilePath "$dir\terminal64.exe" -ArgumentList "/portable" -PassThru
          Start-Sleep -Seconds 60
          "terminal started by hand: alive $(-not $t.HasExited), window '$((Get-Process -Id $t.Id -ErrorAction SilentlyContinue).MainWindowTitle)'" | Out-File $d -Append -Encoding utf8
          "dirs after start: $((Get-ChildItem $dir -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', ')" | Out-File $d -Append -Encoding utf8
          "appdata terminals: $((Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name.Substring(0, 6) }) -join ', ')" | Out-File $d -Append -Encoding utf8
          "session: $([Environment]::UserInteractive) user $env:USERNAME" | Out-File $d -Append -Encoding utf8

      - name: Broker server list (JustMarkets installer -> servers.dat)
        shell: pwsh
        run: |
          $d = "status\mt5_diag.txt"
          $cands = @(
            "https://download.mql5.com/cdn/web/just.global.markets.ltd/mt5/justmarkets5setup.exe",
            "https://download.mql5.com/cdn/web/just.global.markets.mu.ltd/mt5/justmarkets5setup.exe",
            "https://download.mql5.com/cdn/web/justmarkets.ltd/mt5/justmarkets5setup.exe",
            "https://download.mql5.com/cdn/web/just.global.markets/mt5/justmarkets5setup.exe",
            "https://download.mql5.com/cdn/web/justforex.ltd/mt5/justforex5setup.exe",
            "https://download.mql5.com/cdn/web/just.global.markets.ltd/mt5/justforex5setup.exe")
          $got = $null
          foreach ($u in $cands) {
            try { Invoke-WebRequest -Uri $u -OutFile jm.exe -ErrorAction Stop; if ((Get-Item jm.exe).Length -gt 1000000) { $got = $u; break } } catch { }
          }
          "broker installer: $got" | Out-File $d -Append -Encoding utf8
          if ($got) {
            $p = Start-Process -FilePath .\jm.exe -ArgumentList "/auto" -PassThru
            for ($i = 0; $i -lt 120 -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 5 }
            Start-Sleep -Seconds 20
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
            $dirs = Get-ChildItem "C:\Program Files" -Directory | Where-Object { Test-Path "$($_.FullName)\terminal64.exe" } | ForEach-Object { $_.Name }
            "terminal folders: $($dirs -join ', ')" | Out-File $d -Append -Encoding utf8
            $sd = Get-ChildItem "C:\Program Files\*\Config\servers.dat" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "*\MetaTrader 5\Config\*" } | Select-Object -First 1
            if ($sd) {
              Copy-Item $sd.FullName "C:\Program Files\MetaTrader 5\Config\servers.dat" -Force
              "servers.dat copied from $($sd.Directory.Parent.Name) ($($sd.Length) bytes)" | Out-File $d -Append -Encoding utf8
            }
          }

      - name: Python packages
        run: pip install MetaTrader5 pandas requests

      - name: Run a read-only check EA inside the terminal
        timeout-minutes: 9
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $dir = "C:\Program Files\JustMarkets MetaTrader 5"
          $out = "status\mt5_check.txt"
          $ErrorActionPreference = "Continue"
          "folders in the terminal dir: $((Get-ChildItem $dir -Directory | ForEach-Object { $_.Name }) -join ', ')" | Out-File $out -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$dir\MQL5\Experts" | Out-Null
          Copy-Item mt5\CheckEA.mq5 "$dir\MQL5\Experts\CheckEA.mq5" -Force
          $c = Start-Process -FilePath "$dir\metaeditor64.exe" -ArgumentList "/portable /compile:`"$dir\MQL5\Experts\CheckEA.mq5`" /log:`"$dir\compile.log`"" -PassThru
          for ($i = 0; $i -lt 40 -and -not $c.HasExited; $i++) { Start-Sleep -Seconds 3 }
          "compile finished: $($c.HasExited), ex5 exists: $(Test-Path "$dir\MQL5\Experts\CheckEA.ex5")" | Out-File $out -Append -Encoding utf8
          if (Test-Path "$dir\compile.log") { Get-Content "$dir\compile.log" -Tail 5 | ForEach-Object { "  " + $_ } | Out-File $out -Append -Encoding utf8 }
          Get-Process metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $pw = $env:MT5_PASSWORD
          "secret shape: login digits only $($env:MT5_LOGIN -match '^\d+$'), password has ; or # $($pw -match '[;#]'), password has leading/trailing space $($pw -ne $pw.Trim()), server has spaces $($env:MT5_SERVER -match '\s')" | Out-File $out -Append -Encoding utf8
          $sd = "$dir\Config\servers.dat"
          if (Test-Path $sd) {
            $b = [IO.File]::ReadAllBytes($sd)
            $u = [Text.Encoding]::Unicode.GetString($b); $a8 = [Text.Encoding]::ASCII.GetString($b)
            $names = ([regex]::Matches($u + " " + $a8, 'JustMarkets-[A-Za-z0-9]+') | ForEach-Object { $_.Value } | Sort-Object -Unique) -join ', '
            "servers.dat ($($b.Length) bytes) names: $names" | Out-File $out -Append -Encoding utf8
          } else { "servers.dat missing" | Out-File $out -Append -Encoding utf8 }
          $ini = "[Common]`r`nLogin=$env:MT5_LOGIN`r`nPassword=$env:MT5_PASSWORD`r`nServer=$env:MT5_SERVER`r`nKeepPrivate=1`r`nNewsEnable=0`r`n[Experts]`r`nAllowLiveTrading=1`r`nAllowDllImport=0`r`nEnabled=1`r`n[StartUp]`r`nExpert=CheckEA`r`nSymbol=XAUUSD.m`r`nPeriod=M15`r`n"
          [IO.File]::WriteAllText("$dir\start.ini", $ini, [Text.Encoding]::Unicode)
          $t = Start-Process -FilePath "$dir\terminal64.exe" -ArgumentList "/portable /config:`"$dir\start.ini`"" -PassThru
          for ($i = 0; $i -lt 70 -and -not $t.HasExited; $i++) { Start-Sleep -Seconds 5 }
          Remove-Item "$dir\start.ini" -ErrorAction SilentlyContinue
          "terminal closed by the EA: $($t.HasExited) after about $($i * 5) s; accounts.dat exists: $(Test-Path "$dir\Config\accounts.dat")" | Out-File $out -Append -Encoding utf8
          $f = "$dir\MQL5\Files\mt5_ea_check.txt"
          if (Test-Path $f) { Get-Content $f | Out-File $out -Append -Encoding utf8 } else { "EA output file not found" | Out-File $out -Append -Encoding utf8 }
          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          $jl = Get-ChildItem "$dir\logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($jl) {
            "terminal journal (network / account lines, last 30 other lines):" | Out-File $out -Append -Encoding utf8
            $all = Get-Content $jl.FullName -Encoding Unicode
            $all | Where-Object { $_ -match "Network|auth|connect|login|ccount|server|Server|failed|error" } | Select-Object -Last 25 | ForEach-Object { "  N " + ($_ -replace '\d{5,}', '<num>') } | Out-File $out -Append -Encoding utf8
            $all | Select-Object -Last 30 | ForEach-Object { "  " + ($_ -replace '\d{5,}', '<num>') } | Out-File $out -Append -Encoding utf8
          }
          $lg = Get-ChildItem "$dir\MQL5\Logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($lg) { "EA log tail:" | Out-File $out -Append -Encoding utf8; Get-Content $lg.FullName -Tail 15 | ForEach-Object { "  " + ($_ -replace '\d{5,}', '<num>') } | Out-File $out -Append -Encoding utf8 }

      - name: Publish the check result
        if: always()
        shell: bash
        run: |
          python mt5/mask_logs.py || true
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add status/mt5_check.txt status/mt5_logs.txt status/mt5_diag.txt || true
          git commit -m "MT5 check result" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 5; done || true
