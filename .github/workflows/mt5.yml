name: MT5 trader

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["run_mt5.txt"]

permissions:
  contents: write

concurrency:
  group: mt5
  cancel-in-progress: false

jobs:
  mt5:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MetaTrader 5 (silent)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile mt5setup.exe
          Start-Process -FilePath .\mt5setup.exe -ArgumentList "/auto"
          $exe = "C:\Program Files\MetaTrader 5\terminal64.exe"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $exe); $i++) { Start-Sleep -Seconds 5 }
          Start-Sleep -Seconds 20
          Get-Process terminal64, mt5setup -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "terminal installed: $(Test-Path $exe)"

      - name: Python packages
        run: pip install MetaTrader5 pandas requests

      - name: Check terminal and login (no orders)
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: python mt5/mt5_check.py

      - name: Publish the check result
        if: always()
        shell: bash
        run: |
          git config user.name "fizy-bot"
          git config user.email "fizy-bot@users.noreply.github.com"
          git add status/mt5_check.txt || true
          git commit -m "MT5 check result" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep 5; done || true
